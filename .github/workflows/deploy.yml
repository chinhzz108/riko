name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure public Appwrite settings
        run: cp .env.example .env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build site
        run: pnpm build

      - name: Verify AR model and LiteRT runtime assets
        run: |
          node --input-type=module <<'NODE'
          import { stat } from "node:fs/promises";

          const requiredAssets = [
            "dist/models/riko-ar-detector.tflite",
            "dist/litert/wasm/litert_wasm_internal.js",
            "dist/litert/wasm/litert_wasm_internal.wasm",
            "dist/litert/wasm/litert_wasm_compat_internal.js",
            "dist/litert/wasm/litert_wasm_compat_internal.wasm",
          ];

          for (const path of requiredAssets) {
            const { size } = await stat(path);
            if (size <= 0) throw new Error(`Required AR asset is empty: ${path}`);
            console.log(`${path}: ${size.toLocaleString()} bytes`);
          }
          NODE

      - name: Verify MindAR targets and transparent AR clips
        run: |
          node --input-type=module <<'NODE'
          import { readFile, stat } from "node:fs/promises";
          import { brotliDecompressSync } from "node:zlib";

          const compressedTargets = await readFile("dist/ar/book-pages.mind.br");
          const decodedTargets = brotliDecompressSync(compressedTargets);
          if (decodedTargets.byteLength < 1_000_000) throw new Error("Compiled MindAR target bundle is incomplete.");
          console.log(`MindAR targets: ${compressedTargets.byteLength.toLocaleString()} compressed / ${decodedTargets.byteLength.toLocaleString()} decoded bytes`);

          const videos = JSON.parse(await readFile("dist/videos/ar/manifest.json", "utf8"));
          const alphaVideos = videos.filter((video) => video.alpha === true);
          if (alphaVideos.length < 45) throw new Error(`Expected 45 transparent AR videos; found ${alphaVideos.length}.`);
          for (const video of alphaVideos) {
            for (const route of [video.alphaVideoUrl, video.alphaColorUrl, video.alphaMaskUrl]) {
              if (!route) throw new Error(`Incomplete alpha manifest entry: ${video.id}`);
              const { size } = await stat(`dist${route}`);
              if (size <= 0) throw new Error(`Empty alpha asset: ${route}`);
            }
          }

          const headers = await readFile("dist/_headers", "utf8");
          if (!headers.includes("Content-Encoding: br")) throw new Error("Cloudflare Pages is missing the Brotli response header for MindAR.");
          console.log(`Transparent AR clips verified: ${alphaVideos.length}`);
          NODE

      - name: Verify AR QR routing and fallback timing
        run: node scripts/ar/verify_scan_logic.mjs

      - name: Verify AR subject sizing, billboard poses, and packed alpha
        run: node scripts/ar/verify_presentation.mjs

      - name: Verify AR gesture math and smooth tracking
        run: node scripts/ar/verify_motion.mjs

      - name: Verify one-shot AR playback and automatic close-to-scan
        run: node scripts/ar/verify_playback_session.mjs

      - name: Verify AR detail preservation and certified media
        run: node scripts/ar/verify_detail_assets.mjs

      - name: Verify Cloudflare token and Pages access
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: fd0bbca78b8b2bf560e215f756e98e33
          CF_PAGES_PROJECT: rikokid
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_API_TOKEN?.trim();
          if (!token) {
            console.error("CLOUDFLARE_API_TOKEN is missing or empty in GitHub Actions.");
            process.exit(1);
          }

          const headers = { Authorization: `Bearer ${token}` };
          const tokenResponse = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", { headers });
          const tokenResult = await tokenResponse.json();
          const tokenErrors = (tokenResult.errors ?? []).map((error) => error.code).join(",") || "none";
          console.log(`Cloudflare token verification: HTTP ${tokenResponse.status}; status=${tokenResult.result?.status ?? "unknown"}; errors=${tokenErrors}`);
          if (!tokenResponse.ok || tokenResult.result?.status !== "active") {
            console.error("GitHub's CLOUDFLARE_API_TOKEN is not an active Cloudflare token.");
            process.exit(1);
          }

          const projectUrl = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/pages/projects/${process.env.CF_PAGES_PROJECT}`;
          const projectResponse = await fetch(projectUrl, { headers });
          const projectResult = await projectResponse.json();
          const projectErrors = (projectResult.errors ?? []).map((error) => error.code).join(",") || "none";
          console.log(`Cloudflare Pages project access: HTTP ${projectResponse.status}; errors=${projectErrors}`);
          if (!projectResponse.ok) {
            console.error("The token is active but cannot access the rikokid Pages project in the configured account. Check Cloudflare Pages Edit permission, account resources, and the token owner's account access.");
            process.exit(1);
          }

          console.log("Cloudflare token and Pages project access verified.");
          NODE

      - name: Deploy Cloudflare Pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fd0bbca78b8b2bf560e215f756e98e33
          wranglerVersion: "4"
          command: pages deploy dist --project-name=rikokid --branch=main
