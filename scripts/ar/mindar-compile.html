<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR page target compiler</title>
    <style>
      body { margin: 2rem; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
      pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Building MindAR targets</h1>
    <p>This local tool compiles the book's printed page images and saves the target file into public/ar/.</p>
    <pre id="progress">Starting…</pre>
    <script type="module">
      import { Compiler } from "mind-ar/dist/mindar-image.prod.js";

      const output = document.querySelector("#progress");
      const write = (line) => {
        output.textContent += `\n${line}`;
        output.scrollTop = output.scrollHeight;
      };

      try {
        const manifest = await fetch("/ar/book-page-targets.json").then((response) => {
          if (!response.ok) throw new Error(`Target manifest HTTP ${response.status}`);
          return response.json();
        });
        write(`Loading ${manifest.targets.length} images…`);
        const images = await Promise.all(manifest.targets.map((target) => new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Could not load ${target.targetImage}`));
          image.src = target.targetImage;
        })));
        const compiler = new Compiler();
        const data = await compiler.compileImageTargets(images, (progress) => {
          output.dataset.progress = String(progress);
          output.textContent = `Compiling ${images.length} page targets: ${progress.toFixed(1)}%`;
        });
        write(`Compiled ${data.length} target groups.`);
        const buffer = await compiler.exportData();
        write(`Saving ${Math.round(buffer.byteLength / 1024)} KB target bundle…`);
        const response = await fetch("http://localhost:8444/targets", {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: buffer,
        });
        if (!response.ok) throw new Error(`Local file writer HTTP ${response.status}`);
        const result = await response.json();
        write(`Done: ${result.path} (${result.bytes} bytes).`);
      } catch (error) {
        console.error(error);
        write(`FAILED: ${error instanceof Error ? error.stack || error.message : String(error)}`);
      }
    </script>
  </body>
</html>
