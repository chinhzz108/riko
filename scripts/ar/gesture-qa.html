<!doctype html><html><head><meta charset="utf-8"><title>AR gestures regression</title></head>
<body><h1>AR drag, pinch, cancel and controls</h1><output id="result">Running…</output><pre id="details"></pre>
<script type="module">
import { installARGestures } from "/src/lib/arGestures.ts"
import { gestureFrame, poseSmoothingAlpha } from "/src/lib/arMotion.js"
const log=[],assert=(condition,label)=>{if(!condition)throw new Error(label);log.push(`PASS ${label}`)}
try {
 class Stage extends EventTarget {
  dataset={};captures=new Set()
  setPointerCapture(id){this.captures.add(id)}
  hasPointerCapture(id){return this.captures.has(id)}
  releasePointerCapture(id){this.captures.delete(id)}
  closest(){return false}
 }
 const stage=new Stage();let transform={x:0,y:0,scale:1},commits=0,enabled=true
 const cleanup=installARGestures(stage,{canStart:()=>enabled,project:(x,y)=>({x:x/100,y:-y/100}),getTransform:()=>transform,setTransform:value=>{transform=value},commit:()=>commits++})
 const send=(type,id,x,y,target=stage)=>{
  const event=new Event(type,{cancelable:true})
  Object.assign(event,{pointerId:id,clientX:x,clientY:y,button:0})
  Object.defineProperty(event,"target",{value:target});stage.dispatchEvent(event)
 }
 send("pointerdown",1,100,100);send("pointermove",1,140,130);send("pointerup",1,140,130)
 assert(Math.abs(transform.x-.4)<1e-9&&Math.abs(transform.y+.3)<1e-9,"single pointer drag follows page coordinates")
 assert(commits===1&&stage.captures.size===0,"pointer up releases capture and commits once")
 send("pointerdown",1,100,100);send("pointerdown",2,200,100)
 send("pointermove",1,50,100);send("pointermove",2,250,100)
 assert(Math.abs(transform.scale-2)<1e-9,"two fingers double the size")
 assert(Math.abs(transform.x-.4)<1e-9,"symmetric pinch keeps the position")
 send("pointerup",2,250,100);send("pointermove",1,70,110)
 assert(Math.abs(transform.x-.6)<1e-9&&Math.abs(transform.y+.4)<1e-9,"lifting a finger rebases without a jump")
 send("pointercancel",1,70,110)
 assert(!stage.dataset.arDragging&&stage.captures.size===0,"cancellation restores pointer state")
 const before=JSON.stringify(transform)
 send("pointerdown",3,50,50,{closest:()=>true});send("pointermove",3,90,90)
 assert(JSON.stringify(transform)===before,"buttons never move the AR content")
 enabled=false;send("pointerdown",4,0,0);send("pointermove",4,40,40)
 assert(JSON.stringify(transform)===before,"untracked content cannot be dragged")
 cleanup();enabled=true;send("pointerdown",5,0,0);send("pointermove",5,40,40)
 assert(JSON.stringify(transform)===before,"cleanup removes handlers")
 assert(gestureFrame([])===null,"empty pointer set is safe")
 let value=0,rawSquare=0,filteredSquare=0
 for(let frame=0;frame<600;frame++){
  const noisy=frame%2?.01:-.01
  value+=(noisy-value)*poseSmoothingAlpha(1/60,Math.abs(noisy-value),0)
  rawSquare+=noisy**2;filteredSquare+=value**2
 }
 const reduction=1-Math.sqrt(filteredSquare/rawSquare)
 assert(reduction>.8,"stationary alternating pose noise reduced by over 80%")
 const settle=fps=>{let x=0;for(let i=0;i<fps/2;i++)x+=(1-x)*poseSmoothingAlpha(1/fps,0,0);return x}
 assert(Math.abs(settle(30)-settle(60))<1e-9,"smoothing independent of 30/60fps")
 document.querySelector("#result").textContent=`All ${log.length} checks passed · noise reduction ${(reduction*100).toFixed(1)}%`
 document.querySelector("#result").dataset.pass="true"
}catch(error){log.push(String(error));document.querySelector("#result").textContent="FAIL";document.querySelector("#result").dataset.pass="false"}
document.querySelector("#details").textContent=log.join("\n")
</script></body></html>
